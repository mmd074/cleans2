import requests
import random

def get_flag_emoji(code):
    if len(code) != 2 or not code.isalpha():
        return code
    base = ord("🇦") - ord("A")
    return chr(base + ord(code[0].upper())) + chr(base + ord(code[1].upper()))

urls = [
    "https://raw.githubusercontent.com/FoolVPN-ID/Nautica/refs/heads/main/proxyList.txt",
]

all_lines = []

for url in urls:
    try:
        response = requests.get(url, timeout=15)
        response.raise_for_status()
        lines = response.text.strip().split("\n")
        all_lines.extend(lines)
        print(f"Loaded {len(lines)} lines from {url}")
    except Exception as e:
        print(f"Failed to load {url}")
        print(e)

all_lines = list(set(all_lines))
valid_nodes = []

for line in all_lines:
    parts = [p.strip() for p in line.split(",")]
    if len(parts) >= 4:
        ip = parts[0]
        port = parts[1]
        name = parts[2]
        dc = parts[3]
        country_code = name[:2].upper()
        server_name = name[2:] if len(name) > 2 else name
        display_name = f"{get_flag_emoji(country_code)}{server_name}"
        node = f"{ip}:{port}#{display_name}_{dc}"
        valid_nodes.append(node)

valid_nodes = list(set(valid_nodes))
random.shuffle(valid_nodes)

target_ports = {'443', '2053', '8443', '2083', '2096'}
group1 = []
group2 = []

for node in valid_nodes:
    port = node.split(':')[1].split('#')[0]
    if port in target_ports:
        group2.append(node)
    else:
        group1.append(node)

random.shuffle(group1)
random.shuffle(group2)

selected1 = group1[:20]
selected2 = group2[:20]

remaining = [node for node in valid_nodes if node not in selected1 and node not in selected2]
random.shuffle(remaining)
selected3 = remaining[:20]

final_nodes = selected1 + selected2 + selected3

with open("nodes.txt", "w", encoding="utf-8") as f:
    for node in final_nodes:
        f.write(node + "\n")

big_nodes = valid_nodes[:min(5000, len(valid_nodes))]
with open("nodes_5000.txt", "w", encoding="utf-8") as f:
    for node in big_nodes:
        f.write(node + "\n")

print("===================================")
print(f"Total unique nodes: {len(valid_nodes)}")
print(f"Saved {len(final_nodes)} nodes -> nodes.txt")
print(f"Saved {len(big_nodes)} nodes -> nodes_5000.txt")
print("Done!")
